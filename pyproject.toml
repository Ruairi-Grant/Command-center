[project]
name = "command-centre"
version = "0.1.0"
description = "A small personal command centre for task and life administration."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.9,<1",
  "mypy>=1.13,<2",
  "coverage>=7.6,<8",
  "pip-audit>=2.7,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["command-center-prod", "command-center-dev", "data", "backups", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
