name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code quality (Ruff and whitespace)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - name: Install Python and development dependencies
        run: uv sync --locked --group dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Git whitespace check
        run: git diff --check HEAD^ HEAD

  type-check:
    name: Type checking (application boundaries)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - name: Install Python and development dependencies
        run: uv sync --locked --group dev
      - name: Run mypy baseline
        run: uv run mypy lib/cc_config.py lib/cc_store.py lib/cc_dashboard.py --ignore-missing-imports

  functional-tests:
    name: Functional tests (legacy, pytest, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - name: Install Python and development dependencies
        run: uv sync --locked --group dev
      - name: Run complete legacy suite
        run: uv run python tests/run_all.py
      - name: Run pytest suite with coverage
        run: uv run coverage run --source=lib -m pytest -q
      - name: Report coverage
        run: uv run coverage report -m

  security:
    name: Security (history secrets and dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan Git history and working tree with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - name: Install Python and development dependencies
        run: uv sync --locked --group dev
      - name: Audit Python environment
        run: uv run pip-audit --progress-spinner off

  compatibility:
    name: Python 3.12 compatibility checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - name: Install the locked Python environment
        run: uv sync --locked --group dev
      - name: Compile application and test sources
        run: uv run python -m compileall -q lib tests
      - name: Verify locked resolution
        run: uv lock --check
